[package]
name = "jpdem"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ikuto32/japan-1to1-minecraft"

[dependencies]
anyhow = "1.0.104"
encoding_rs = "0.8"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libdeflater = "1.26.1"
memmap2 = "0.9.11"
mimalloc = "0.1.52"
osmpbf = "0.3.8"
png = "0.18.1"
quick-xml = "0.42.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tiff = "0.11.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
